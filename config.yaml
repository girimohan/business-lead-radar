# Barmo's free website audit (barmo.fi): offered as a P.S. to every business whose website the radar read.
audit:
  url: https://www.barmo.fi/#audit
  line: "P.S. Barmo also does a free website audit: within 48 hours you get five concrete improvements for speed, search visibility and getting more enquiries, no strings attached."
  line_fi: "P.S. Teemme myös maksuttoman verkkosivuauditoinnin: 48 tunnissa saatte viisi konkreettista parannusta sivujen nopeuteen, hakunäkyvyyteen ja yhteydenottojen määrään, ilman sitoumuksia."

# Reading the businesses' own websites. Registered companies' sites are read first (they may be emailed).
# Across the whole country there are tens of thousands of sites: each run reads a batch, the rest are cached.
enrichment:
  enabled: true
  max_sites_per_run: 1500      # new websites read per run (cached ones are free)
  max_domain_guesses_per_run: 400
  max_pages_per_site: 4
  refresh_days: 30

# OpenStreetMap places change slowly: reuse an answer this many days old before asking Overpass again.
osm_refresh_days: 6

# Emails you send one by one from your own mailbox. The dashboard counts today's and warns past this number:
# a new sender address that suddenly sends many cold emails lands in spam, and one-to-one is the point.
email_daily_limit: 25

min_score: 30            # leads below this are not shown (no evidenced fit and no email route)
retention_days: 180      # a lead you never contacted is deleted this long after it was first seen
follow_up_days: 10
