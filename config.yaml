  business: "Barmo"            # trading name
  business_id: "3111862-6"     # Y-tunnus
  email: "barmo.fin@gmail.com"                    # the address you send from
  phone: ""
  website: "https://www.barmo.fi"
  city: "Vantaa"
  privacy_url: ""              # public link to your prospect privacy notice (template: docs/tietosuojaseloste.md)

# Where to look: "all" for the whole of Finland, or a list of municipalities and/or regions (maakunta), in
# Finnish: [Vantaa, Helsinki] or [Uusimaa, Pirkanmaa]. The dashboard filters by region and municipality either way.
# A quick local run for one town: python -m bizradar run --area Vantaa
area: all

