name: Daily business lead radar

# Business contacts are personal data when the business is a sole trader. On GitHub they only ever exist
# encrypted with the RADAR_PASSPHRASE secret: the published page asks for the passphrase, the saved state is
# encrypted, your opt-out list arrives encrypted (data/shared.enc), and the issue carries counts only.

on:
  schedule:
    - cron: "17 4 * * *"   # 06:17 Helsinki in winter, 07:17 in summer
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: business-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RADAR_PASSPHRASE: ${{ secrets.RADAR_PASSPHRASE }}
      PYTHONUNBUFFERED: "1"   # show progress lines as they happen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check the passphrase secret is set
        run: |
          if [ ${#RADAR_PASSPHRASE} -lt 12 ]; then
            echo "::error::Set the RADAR_PASSPHRASE secret (12+ characters): gh secret set RADAR_PASSPHRASE"; exit 1
          fi
      - name: Tests
        run: python -m pytest -q

      - name: Restore the last run's state (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: business-radar-state-${{ github.run_id }}
          restore-keys: business-radar-state-
      - run: python -m bizradar state load
      - name: Load your opt-outs and contacted statuses (data/shared.enc)
        run: python -m bizradar state shared

      - name: Collect the whole country, read websites, score
        id: radar
        env:
          RADAR_SENDER: ${{ secrets.RADAR_SENDER }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m bizradar run

      - name: Encrypt this run's state (also when a run fails or is stopped, so the next one continues)
        if: always()
        run: python -m bizradar state save
      - name: Save this run's state (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: business-radar-state-${{ github.run_id }}

      - name: Encrypt the dashboard
        run: python -m bizradar seal --out site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Tell me about new leads (an issue, which GitHub emails to you; counts only, no names)
        if: steps.radar.outputs.new_today != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create radar --color 36C47F --description "Daily radar summary" --force >/dev/null
          for n in $(gh issue list --label radar --state open --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed >/dev/null
          done
          gh issue create --label radar \
            --title "Lead radar $(date +%F): ${{ steps.radar.outputs.new_today }} new, ${{ steps.radar.outputs.emailable }} may be emailed" \
            --body-file private/notice.md
